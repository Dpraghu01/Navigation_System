<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Indoor Navigator</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    /* Landing page specific layout */
    body { display: flex; justify-content: center; align-items: center; background-color: #0f1117; }
    .auth-container { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 16px 32px rgba(0,0,0,0.5); }
    .auth-container h1 { text-align: center; color: #38bdf8; margin-bottom: 24px; font-size: 1.5rem; }
    .auth-container input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 6px; border: 1px solid #334155; background: #0f1117; color: white; }
    .auth-container button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .auth-container button:hover { background: #0369a1; }
    .auth-toggle { text-align: center; margin-top: 16px; font-size: 0.9rem; color: #94a3b8; cursor: pointer; }
    .auth-toggle span { color: #38bdf8; }
    #error-msg { color: #ef4444; font-size: 0.85rem; text-align: center; margin-bottom: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1 id="auth-title">Sign In</h1>
    <div id="error-msg"></div>
    <form id="auth-form">
      <input type="text" id="username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Login</button>
    </form>
    <div class="auth-toggle" id="toggle-mode">
      Don't have an account? <span>Register here</span>
    </div>
  </div>
  <script type="module" src="./src/landing.js"></script>
</body>
</html>
